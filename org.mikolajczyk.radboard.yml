app-id: org.mikolajczyk.radboard
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: radboard

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

modules:
  - name: radboard
    buildsystem: simple
    build-commands:
      - install -Dm755 radboard /app/bin/radboard
      - install -Dm644 radboard.desktop /app/share/applications/org.mikolajczyk.radboard.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/radboard.png
      - install -Dm644 radboard.metainfo.xml /app/share/metainfo/org.mikolajczyk.radboard.metainfo.xml
    sources:
      - type: file
        path: src-tauri/target/release/radboard
      - type: file
        path: packaging/radboard.desktop
      - type: file
        path: src-tauri/icons/icon.png
      - type: file
        path: packaging/radboard.metainfo.xml
